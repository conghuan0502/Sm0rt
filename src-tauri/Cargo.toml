[package]
name = "sm0rt-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
sm0rt-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
